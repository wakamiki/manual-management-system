<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル編集画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">マニュアル編集</h1>
      <a href="./manual-detail.html" class="btn btn-outline-secondary">詳細へ戻る</a>
    </div>

    <form class="card">
      <div class="card-body">
        <div class="mb-3">
          <label for="title" class="form-label">タイトル</label>
          <input id="title" type="text" class="form-control" value="発注業務の流れ">
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">本文</label>
          <textarea id="content" class="form-control" rows="8">既存本文</textarea>
        </div>
        <div class="mb-3">
          <label for="category" class="form-label">カテゴリ</label>
          <select id="category" class="form-select">
            <option selected>営業部</option>
            <option>総務部</option>
            <option>経理部</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="changeNote" class="form-label">変更理由</label>
          <input id="changeNote" type="text" class="form-control">
        </div>
      </div>
      <div class="card-footer d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-outline-primary">申請</button>
        <button type="button" class="btn btn-outline-success">承認</button>
        <button type="button" class="btn btn-outline-warning">差し戻し</button>
        <button type="button" class="btn btn-outline-danger">アーカイブ</button>
        <a href="./manual-create.html" class="btn btn-outline-secondary">複製</a>
      </div>
    </form>
  </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
