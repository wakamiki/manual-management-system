<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル新規作成画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <main class="container mock-page">
    <div class="page-title-bar tight-gap">
      <h1 class="h3 mb-0">マニュアル新規作成</h1>
      <button onclick="window.close()" class="btn btn-outline-secondary">閉じる</button>
    </div>

    <div class="alert mock-alert mt-0 mb-2" role="alert">
      入力内容を保存しました。
    </div>

    <form class="card">
      <div class="card-body">
        <div class="mb-3">
          <label for="title" class="form-label">タイトル</label>
          <input id="title" type="text" class="form-control">
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">本文</label>
          <textarea id="content" class="form-control" rows="8"></textarea>
        </div>
        <div class="mb-3">
          <label for="category" class="form-label">カテゴリ</label>
          <select id="category" class="form-select">
            <option>営業部</option>
            <option>総務部</option>
            <option>経理部</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="changeNote" class="form-label">変更理由</label>
          <input id="changeNote" type="text" class="form-control">
        </div>
      </div>
      <div class="card-footer d-flex gap-2">
        <button type="submit" class="btn btn-primary">下書き保存</button>
        <button type="button" class="btn btn-outline-primary">確認して申請</button>
        <button onclick="window.close()" class="btn btn-outline-secondary">閉じる</button>
      </div>
    </form>
  </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
