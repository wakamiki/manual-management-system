<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル詳細画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <main class="container mock-page">
    <header class="page-title-bar tight-gap">
      <div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <h1 class="h4 mb-0">配送手順の流れ</h1>
          <span class="badge bg-success">承認済</span>
        </div>
        <p class="text-muted mb-0">マニュアルID: 1001 / 営業部 / 作成日時: 2026-04-04 09:00 / 更新日: 2026-04-05 / 作成者: 山田 花子</p>
      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary">閉じる</button>
    </header>

    <div class="alert mock-alert mt-0 mb-2" role="alert">
      マニュアルを更新しました。
    </div>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">本文</h2>
        <p class="mb-0">本文のレビュー</p>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">更新履歴</h2>
        <ul class="mb-0">
          <li>2026-04-05: 本文の修正</li>
          <li>2026-04-04: 初回作成</li>
        </ul>
      </div>
    </section>

    <div class="d-flex flex-wrap gap-2">
      <a href="./manual-form.html" target="_blank" rel="noopener noreferrer" class="btn btn-primary">編集（作成者専用）</a>
      <a href="./manual-form.html" target="_blank" rel="noopener noreferrer" class="btn btn-outline-secondary">複製</a>
      <button type="button" class="btn btn-outline-primary">マニュアル公開</button>
      <button type="button" class="btn btn-outline-success">承認</button>
      <button type="button" class="btn btn-outline-warning">差し戻し</button>
      <button type="button" class="btn btn-outline-danger">アーカイブ</button>
      <button type="button" class="btn btn-outline-info">復帰</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
