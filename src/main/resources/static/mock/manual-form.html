<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル入力画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <main class="container mock-page">
    <div class="page-title-bar tight-gap">
      <div>
        <h1 class="h4 mb-1">マニュアル入力</h1>
        <p class="text-muted mb-0">マニュアルID: 1001 / 作成日時: 2026-04-04 09:00 / 更新日時: 2026-04-08 10:30 / 作成者: 山田 花子</p>
      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary">閉じる</button>
    </div>

    <div class="alert mock-alert mt-0 mb-2" role="alert">
      変更を一時保存しました。
    </div>

    <form class="card">
      <div class="card-body">
        <div class="mb-3">
          <label for="title" class="form-label">タイトル</label>
          <input id="title" type="text" class="form-control" value="配送手順の流れ">
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">本文</label>
          <textarea id="content" class="form-control" rows="8">既定本文</textarea>
        </div>
        <div class="mb-3">
          <label for="category" class="form-label">カテゴリ</label>
          <select id="category" class="form-select">
            <option selected>営業部</option>
            <option>経理部</option>
            <option>総務部</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="changeNote" class="form-label">変更理由</label>
          <input id="changeNote" type="text" class="form-control">
        </div>
      </div>
      <div class="card-footer d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">下書きに保存</button>
        <button type="button" class="btn btn-outline-primary">マニュアル公開</button>
        <button type="button" class="btn btn-outline-success">承認</button>
        <button type="button" class="btn btn-outline-warning">差し戻し</button>
        <button type="button" class="btn btn-outline-danger">アーカイブ</button>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
