<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアルエディター</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <main class="container mock-page">
    <div class="page-title-bar tight-gap">
      <div>
        <span class="badge mb-1 mode-badge">編集</span>
        <h1 class="h4 mb-1">マニュアルエディター</h1>
        <p class="text-muted mb-0">マニュアルID: 1001 / 作成日時: 2026-04-04 09:00 / 更新日時: 2026-04-08 10:30 / 作成者: 山田 花子</p>
      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary">閉じる</button>
    </div>

    <div class="alert mock-alert mt-0 mb-2" role="alert">
      編集内容を更新できます。更新履歴は任意です。
    </div>

    <form class="card">
      <div class="card-body">
        <div class="mb-3">
          <label for="title" class="form-label">タイトル</label>
          <input id="title" type="text" class="form-control" value="配送手順の流れ" maxlength="100">
          <div class="text-count" data-for="title" data-max="100">0 / 100</div>
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">本文</label>
          <textarea id="content" class="form-control" rows="8" maxlength="10000">既定本文</textarea>
          <div class="text-count" data-for="content" data-max="10000">0 / 10000</div>
        </div>
        <div class="mb-3">
          <label for="category" class="form-label">カテゴリ</label>
          <select id="category" class="form-select">
            <option selected>営業部</option>
            <option>経理部</option>
            <option>総務部</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="changeNote" class="form-label">更新履歴</label>
          <input id="changeNote" type="text" class="form-control" maxlength="100">
          <div class="text-count" data-for="changeNote" data-max="100">0 / 100</div>
        </div>
      </div>
      <div class="card-footer d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">更新保存</button>
        <button type="button" class="btn btn-outline-primary">下書きに保存</button>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:if="${manualListNeedsRefresh}">
    localStorage.setItem("manualListNeedsRefresh", Date.now());
  </script>
  <script>
    function updateTextCount(inputId, maxLength) {
      const input = document.getElementById(inputId);
      const counter = document.querySelector(`.text-count[data-for="${inputId}"]`);

      if (!input || !counter) {
        return;
      }

      const currentLength = input.value.length;
      counter.textContent = `${currentLength} / ${maxLength}`;
      counter.classList.remove("is-near-limit", "is-over-limit");

      if (currentLength >= maxLength) {
        counter.classList.add("is-over-limit");
        return;
      }

      if (currentLength >= Math.floor(maxLength * 0.8)) {
        counter.classList.add("is-near-limit");
      }
    }

    ["title", "content", "changeNote"].forEach((inputId) => {
      const input = document.getElementById(inputId);
      const counter = document.querySelector(`.text-count[data-for="${inputId}"]`);

      if (!input || !counter) {
        return;
      }

      const maxLength = Number(counter.dataset.max);
      updateTextCount(inputId, maxLength);
      input.addEventListener("input", () => updateTextCount(inputId, maxLength));
    });
  </script>
</body>
</html>
