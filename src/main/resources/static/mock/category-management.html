<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カテゴリ管理画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <main class="container admin-page">
    <header class="page-title-bar">
      <div>
        <h1 class="h3 mb-1">カテゴリ管理</h1>
        <p class="mb-0 text-muted">カテゴリ名、表示順、利用状態を管理します。</p>
      </div>
      <a href="./index.html" class="btn btn-outline-secondary">トップへ戻る</a>
    </header>

    <div class="alert admin-alert mb-4" role="alert">
      カテゴリを更新しました。
    </div>

    <section class="admin-layout">
      <div class="card admin-form-card">
        <div class="card-header">カテゴリ登録 / 編集</div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="categoryName" class="form-label">categoryName</label>
              <input id="categoryName" type="text" class="form-control" value="営業部">
            </div>
            <div class="mb-4">
              <label for="displayOrder" class="form-label">displayOrder</label>
              <input id="displayOrder" type="number" class="form-control" value="1">
            </div>
            <div class="admin-form-actions">
              <button type="button" class="btn btn-primary">作成</button>
              <button type="button" class="btn btn-outline-primary">保存</button>
              <button type="button" class="btn btn-outline-danger">使用停止</button>
              <button type="button" class="btn btn-outline-secondary">再有効化</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card admin-table-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>カテゴリ一覧</span>
          <span class="admin-note">表示順で並び替え</span>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th scope="col">categoryName</th>
                  <th scope="col">displayOrder</th>
                  <th scope="col">status</th>
                  <th scope="col">操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>営業部</td>
                  <td>1</td>
                  <td><span class="admin-status is-active">使用中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <button type="button" class="btn btn-outline-primary btn-sm">保存</button>
                      <button type="button" class="btn btn-outline-danger btn-sm">使用停止</button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>総務部</td>
                  <td>2</td>
                  <td><span class="admin-status is-active">使用中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <button type="button" class="btn btn-outline-primary btn-sm">保存</button>
                      <button type="button" class="btn btn-outline-danger btn-sm">使用停止</button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>経理部</td>
                  <td>3</td>
                  <td><span class="admin-status is-active">使用中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <button type="button" class="btn btn-outline-primary btn-sm">保存</button>
                      <button type="button" class="btn btn-outline-danger btn-sm">使用停止</button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>旧営業部</td>
                  <td>9</td>
                  <td><span class="admin-status is-inactive">停止中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <button type="button" class="btn btn-outline-secondary btn-sm">再有効化</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
