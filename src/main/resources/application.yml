spring:
  application:
    name: manual
  datasource:
    url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8081

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level %class.%M - %msg%n"

app:
  guest-login:
    login-id: ${GUEST_LOGIN_ID:}
    password: ${GUEST_LOGIN_PASSWORD:}
