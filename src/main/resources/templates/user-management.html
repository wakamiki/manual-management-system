<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー管理画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
  <main class="container admin-page">
    <header class="page-title-bar">
      <div>
        <h1 class="h4 mb-1">ユーザー管理</h1>
        <p class="mb-0 text-muted">ユーザー情報、権限、利用状態を管理します。</p>
      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary">閉じる</button>
    </header>

    <div class="alert user-manegement-alert mb-4" role="alert" th:if="${message != null}" th:classappend="${
       messageType == 'success' ? ' alert-success' :
       messageType == 'error'   ? ' alert-danger'  :
       messageType == 'warning' ? ' alert-warning' : ' alert-info'
     }" th:text="${message != null and !#strings.isEmpty(message) ? message : ''}">
      ユーザーを新規作成しました。
    </div>

    <section class="admin-layout">
      <div class="card admin-form-card">
        <div class="admin-mode-title d-flex justify-content-center" th:if="${'CREATE'.equals(formDto.mode.name())}">
          ユーザー新規作成モード</div>
        <div class="admin-mode-title d-flex justify-content-center" th:if="${'EDIT'.equals(formDto.mode.name())}">
          ユーザー更新モード</div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="userId" class="form-label">userId</label>
              <input id="userId" type="text" class="form-control" th:if="${formDto.targetUser != null}"
                th:text="${formDto.targetUser.loginId}">
            </div>
            <div class="mb-3">
              <label for="displayName" class="form-label">displayName</label>
              <input id="displayName" type="text" class="form-control" th:if="${formDto.targetUser != null}"
                th:text="${formDto.targetUser.displayName}">
            </div>
            <div class="mb-4">
              <label for="role" class="form-label">role</label>
              <select id="role" class="form-select">
                <option th:each="role:${formDto.allRole}" th:text="${role}">USER</option>
              </select>
            </div>
            <div class="admin-form-actions">
              <button type="button" class="btn btn-primary"
                th:if="${'CREATE'.equals(formDto.mode.name())}">新規作成</button>
              <button type="button" class="btn btn-outline-primary"
                th:if="${'EDIT'.equals(formDto.mode.name())}">更新</button>
              <button type="button" class="btn btn-outline-danger" th:if="${'EDIT'.equals(formDto.mode.name()) and
              formDto.targetUser.isActive==true}">停止</button>
              <button type="button" class="btn btn-outline-secondary" th:if="${'EDIT'.equals(formDto.mode.name()) and
              formDto.targetUser.isActive==false}">復帰</button>
              <button type="button" class="btn btn-outline-warning"
                th:if="${'EDIT'.equals(formDto.mode.name())}">パスワードリセット</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card admin-table-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>USER一覧</span>
          <span class="admin-note" th:text="|全${formDto.userCount}件|">全 4 件</span>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th scope="col">userId</th>
                  <th scope="col">displayName</th>
                  <th scope="col">role</th>
                  <th scope="col">status</th>
                  <th scope="col">lastLoginAt</th>
                  <th scope="col">操作</th>
                </tr>
              </thead>
              <tbody th:each="user:${formDto.allUserDto}">
                <tr>
                  <td th:text="${user.loginId}">admin01</td>
                  <td th:text="${user.displayName}">管理 太郎</td>
                  <td><span class="admin-status is-admin" th:text="${user.role}">ADMIN</span></td>
                  <td><span class="admin-status is-active" th:if="${user.isActive}"
                      th:text="${user.activeLabel}">利用中</span>
                    <span class="admin-status is-inactive" th:if="${!user.isActive}"
                      th:text="${user.activeLabel}">停止中</span>
                  </td>
                  <td th:text="${#temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm')}">2026-04-05 09:15</td>
                  <td>
                    <div class="admin-inline-actions">
                      <a type="button" class="btn btn-outline-primary btn-sm"
                        th:href="@{/users/action/{userId}(userId=${user.id})}">設定</a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <nav class="admin-pagination" aria-label="ユーザー一覧ページ切り替え">
            <ul class="pagination justify-content-center mb-0">
              <li class="page-item disabled"><span class="page-link">前へ</span></li>
              <li class="page-item active"><span class="page-link">1</span></li>
              <li class="page-item"><a class="page-link" href="#">2</a></li>
              <li class="page-item"><a class="page-link" href="#">3</a></li>
              <li class="page-item"><a class="page-link" href="#">次へ</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertEl = document.getElementById("flashMessage");
      if (!alertEl) return;
      setTimeout(() => {
        alertEl.style.transition = "opacity .4s";
        alertEl.style.opacity = "0";
        setTimeout(() => alertEl.remove(), 400);
      }, 3000);
    });
  </script>
</body>

</html>
