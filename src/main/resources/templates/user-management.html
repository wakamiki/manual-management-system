<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー管理画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
  <main class="container admin-page">
    <header class="page-title-bar admin-title-bar">
      <div>
        <h1 class="h4 mb-1 d-flex">ユーザー管理</h1>
        <p class="mb-0 text-muted d-flex">ユーザー情報、権限、利用状態を管理します。</p>
      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary admin-close-btn">閉じる</button>
    </header>

    <div id="flashMessage" class="alert user-management-alert mb-4" role="alert"
      th:if="${message != null and (isCredentialNotice == null or !isCredentialNotice)}" th:classappend="${
       messageType == 'success' ? ' alert-success' :
       messageType == 'error'   ? ' alert-danger'  :
       messageType == 'warning' ? ' alert-warning' : ' alert-info'
     }" th:text="${message != null and !#strings.isEmpty(message) ? message : ''}">
      ユーザーを新規作成しました。
    </div>
    <div id="credentialNotice" class="alert alert-warning user-management-alert mb-4" role="alert"
      th:if="${isCredentialNotice}">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div>
          <div class="fw-semibold mb-1" th:text="${message}">初期パスワードを発行しました。</div>
          <div class="small text-muted mb-2">このパスワードは再表示できません。控えてください。</div>
          <div class="d-flex align-items-center gap-2">
            <code id="issuedPasswordText" th:text="${issuedPassword}">temp-password</code>
            <button id="copyPasswordBtn" type="button" class="btn btn-outline-secondary btn-sm">コピー</button>
            <span id="copyResult" class="small text-muted"></span>
          </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    </div>

    <section class="admin-layout">
      <div class="card admin-form-card">
        <div class="admin-mode-title d-flex justify-content-center" th:if="${'CREATE'.equals(viewDto.mode.name())}">
          ユーザー新規作成モード</div>
        <div class="admin-mode-title d-flex justify-content-center" th:if="${'EDIT'.equals(viewDto.mode.name())}">
          ユーザー更新モード</div>

        <div class="form-mode-info d-flex justify-content-end"
          th:if="${viewDto.mode != null and 'EDIT'.equals(viewDto.mode.name())}">
          <span class="admin-mode-select" th:text="|編集中:${formDto.loginId}|">
            編集中:
          </span>
          <a class="admin-mode-select" th:href="@{/users}">
            ×選択解除
          </a>
        </div>

        <div class="card-body">
          <form th:object="${formDto}" th:action="@{/users/create}" method="post">
            <div class="mb-3" th:if="${'EDIT'.equals(viewDto.mode.name())}">
              <label for="id" class="form-label">id</label>
              <input id="id" type="hidden" class="form-control" th:if="${'EDIT'.equals(viewDto.mode.name())}"
                th:field="*{id}" readonly>
            </div>
            <div class="mb-3">
              <label for="userId" class="form-label">userId</label>
              <input id="userId" type="text" class="form-control" th:field="*{loginId}" th:errors="*{loginId}">
            </div>
            <div class="mb-3">
              <label for="displayName" class="form-label">displayName</label>
              <input id="displayName" type="text" class="form-control" th:field="*{displayName}"
                th:errors="*{displayName}">
            </div>
            <div class="mb-4">
              <label for="role" class="form-label">role</label>
              <select id="role" class="form-select" th:field="*{role}">
                <option th:each="role:${viewDto.allRole}" th:text="${role}" th:value="${role}" th:errors="*{role}">USER
                </option>
              </select>
            </div>
            <div class="admin-form-actions">
              <button type="submit" class="btn btn-primary admin-button-primry"
                th:if="${formDto != null or 'CREATE'.equals(viewDto.mode.name())}" th:formaction="@{/users/create}"
                th:disabled="${viewDto.canGuest}">新規作成</button>
              <button type="submit" class="btn btn-outline-primary"
                th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name())}"
                th:formaction="@{/users/{userId}/update(userId=${formDto.id})}"
                th:disabled="${viewDto.canGuest}">更新</button>
              <button type="submit" class="btn btn-outline-danger" th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name()) and
              formDto.isActive==true}" th:formaction="@{/users/{userId}/deactivate(userId=${formDto.id})}"
                th:disabled="${viewDto.canGuest}">停止</button>
              <button type="submit" class="btn btn-outline-secondary" th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name()) and
              formDto.isActive==false}" th:formaction="@{/users/{userId}/activate(userId=${formDto.id})}"
                th:disabled="${viewDto.canGuest}">復帰</button>
              <button type="submit" class="btn btn-outline-warning"
                th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name())}"
                th:formaction="@{/users/{userId}/reset-password(userId=${formDto.id})}"
                th:disabled="${viewDto.canGuest}">パスワードリセット</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card admin-table-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>USER一覧</span>
          <span class="admin-note" th:text="|全${viewDto.userCount}件|">全 4 件</span>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle user-table">
              <thead>
                <tr>
                  <th scope="col" class="user-table-head" th:if="${!viewDto.canGuest}">userId</th>
                  <th scope="col" class="user-table-head">displayName</th>
                  <th scope="col" class="user-table-head">role</th>
                  <th scope="col" class="user-table-head">status</th>
                  <th scope="col" class="user-table-head" th:if="${!viewDto.canGuest}">lastLoginAt</th>
                  <th scope="col" class="user-table-head" th:if="${!viewDto.canGuest}">操作</th>
                </tr>
              </thead>
              <tbody th:each="user:${viewDto.allUserDto}">
                <tr>
                  <td th:text="${user.loginId}" th:if="${!viewDto.canGuest}">admin01</td>
                  <td th:text="${user.displayName}">管理 太郎</td>
                  <td><span class="admin-status is-admin" th:text="${user.role}">ADMIN</span></td>
                  <td><span class="admin-status is-active" th:if="${user.isActive}"
                      th:text="${user.activeLabel}">利用中</span>
                    <span class="admin-status is-inactive" th:if="${!user.isActive}"
                      th:text="${user.activeLabel}">停止中</span>
                  </td>
                  <td th:text="${#temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm')}" th:if="${!viewDto.canGuest}">
                    2026-04-05 09:15</td>
                  <td th:if="${!viewDto.canGuest}">
                    <div class="admin-inline-actions">
                      <a class="btn btn-outline-primary btn-sm"
                        th:href="@{/users/{userId}/action(userId=${user.id})}">設定</a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <nav class="admin-pagination" aria-label="ユーザー一覧ページ切り替え" th:if="${viewDto.pagingDto.totalPages>0}">
            <ul class="pagination justify-content-center mb-0">
              <li class="page-item" th:classappend="${!viewDto.pagingDto.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${viewDto.pagingDto.currentPage-1},
                size=${viewDto.pagingDto.pageSize})}">前へ</a>
              </li>
              <li class="page-item" th:each="pageNum : ${#numbers.sequence(0,viewDto.pagingDto.totalPages - 1)}"
                th:classappend="${pageNum == viewDto.pagingDto.currentPage} ? 'active'">
                <a class="page-link" th:text="${pageNum+1}"
                  th:href="@{/users(page=${pageNum},size=${viewDto.pagingDto.pageSize})}">1</a>
              </li>
              <li class="page-item" th:classappend="${!viewDto.pagingDto.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${viewDto.pagingDto.currentPage+1},
                size=${viewDto.pagingDto.pageSize})}">次へ</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertEl = document.getElementById("flashMessage");
      if (!alertEl) return;
      setTimeout(() => {
        alertEl.style.transition = "opacity .4s";
        alertEl.style.opacity = "0";
        setTimeout(() => alertEl.remove(), 400);
      }, 3000);
    });
    document.getElementById("copyPasswordBtn")?.addEventListener("click", async () => {
      const text = document.getElementById("issuedPasswordText")?.textContent?.trim();
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById("copyResult").textContent = "コピーしました";
      } catch {
        document.getElementById("copyResult").textContent = "コピーに失敗しました";
      }
    });
  </script>
</body>

</html>
