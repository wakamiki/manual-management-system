<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>業務マニュアル管理システム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .sidebar {
      min-height: 100vh;
      border-right: 1px solid #dee2e6;
    }

    .category-item {
      cursor: pointer;
    }

    .manual-card {
      transition: transform 0.2s ease;
    }

    .manual-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row border-bottom bg-white p-3">
      <div class="col-md-4">
        <h3 class="mb-0">業務マニュアル管理システム</h3>
      </div>
      <div class="col-md-8">
        <form th:action="@{/}" method="get">
          <div class="input-group">
            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="タイトルで検索">
            <button class="btn btn-primary" type="submit">検索</button>
          </div>
        </form>
      </div>
    </div>

    <div class="row">
      <div class="col-md-3 bg-white sidebar p-3">
        <h5 class="mb-3">カテゴリ</h5>

        <ul class="list-group mb-3">
          <li class="list-group-item category-item" th:each="category : ${activeCategories}"
            th:text="${category.categoryName}">
            カテゴリ名
          </li>
        </ul>

        <button class="btn btn-outline-secondary w-100" type="button" data-bs-toggle="collapse"
          data-bs-target="#inactiveCategories">
          <span th:text="|使用停止カテゴリ (${inactiveCategoryCount}) ▼|">使用停止カテゴリ (0) ▼</span>
        </button>

        <div class="collapse mt-2" id="inactiveCategories">
          <ul class="list-group">
            <li class="list-group-item" th:each="category : ${inactiveCategories}" th:text="${category.categoryName}">
              使用停止カテゴリ名
            </li>
          </ul>
        </div>
      </div>

      <div class="col-md-9 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">マニュアル一覧</h4>
          <span class="text-muted small" th:text="|${manualCount}件|">0件</span>
        </div>

        <div class="alert alert-secondary" th:if="${manuals == null or #lists.isEmpty(manuals)}">
          表示できるマニュアルがありません。
        </div>

        <div class="row g-3" th:if="${manuals != null and !#lists.isEmpty(manuals)}">
          <div class="col-md-6" th:each="manual : ${manuals}">
            <div class="card manual-card shadow-sm h-100">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                  <h5 class="card-title mb-0" th:text="${manual.title}">タイトル</h5>

                  <span class="badge" th:switch="${manual.status}"
                    th:classappend="${manual.status.name() == 'APPROVED'} ? ' text-bg-success' : (${manual.status.name() == 'PENDING'} ? ' text-bg-warning' : (${manual.status.name() == 'ARCHIVED'} ? ' text-bg-secondary' : ' text-bg-dark'))"
                    th:text="${manual.status}">
                    STATUS
                  </span>
                </div>

                <p class="text-muted small mb-2"
                  th:text="|カテゴリ: ${manual.category.categoryName} / 更新日: ${#temporals.format(manual.updatedAt, 'yyyy-MM-dd HH:mm')}|">
                  カテゴリ / 更新日
                </p>

                <p class="card-text flex-grow-1"
                  th:text="${#strings.length(manual.content) > 60 ? #strings.substring(manual.content, 0, 60) + '...' : manual.content}">
                  本文抜粋
                </p>

                <a class="btn btn-outline-primary btn-sm mt-auto align-self-start"
                  th:href="@{/manuals/{id}(id=${manual.id})}">
                  詳細を見る
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
