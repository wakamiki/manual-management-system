<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>index</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>
  <main class="container index-page">
    <header class="page-header">
      <div>
        <h1 class="h4 mb-0">業務マニュアル管理システム</h1>
      </div>

      <div class="page-actions">
        <form class="search-form" th:action="@{/manuals/index}" method="get">
          <details class="search-filter">
            <summary>カテゴリ</summary>
            <div class="search-filter-panel">
              <div class="search-check" th:each="activeCategories:${listDto.activeCategories}">
                <span th:text="${activeCategories.categoryName}">カテゴリ名</span>
                <label><input type="checkbox" name="categoryIds" th:value="${activeCategories.id}"
                    th:checked="${manualSearchConditionDto.categoryIds != null and #lists.contains(manualSearchConditionDto.categoryIds, activeCategories.id)}"></label>
              </div>
              <details class="search-subfilter">
                <summary>使用停止中</summary>
                <div class="search-subfilter-panel">
                  <div class="search-check search-check-sub" th:each="inactiveCategories:${listDto.inactiveCategories}">
                    <span th:text="${inactiveCategories.categoryName}">カテゴリ名</span>
                    <label><input type="checkbox" name="categoryIds" th:value="${inactiveCategories.id}"
                        th:checked="${manualSearchConditionDto.categoryIds != null and #lists.contains(manualSearchConditionDto.categoryIds, inactiveCategories.id)}"></label>
                  </div>
                </div>
              </details>
            </div>
          </details>
          <details class="search-filter">
            <summary>ステータス</summary>
            <div class="search-filter-panel">
              <div class="search-check" th:each="status:${listDto.defaultStatuses}">
                <span th:text="${status.statusLabel}">ステータス名</span>
                <label><input type="checkbox" name="statuses" th:value="${status.status}"
                    th:checked="${status.status != null and manualSearchConditionDto.statuses != null and #lists.contains(manualSearchConditionDto.statuses, status.status)}">
                </label>
              </div>
            </div>
          </details>
          <input type="search" class="form-control" name="keyword" th:value="${manualSearchConditionDto.keyword}"
            placeholder="キーワード検索">
          <button type="submit" class="btn btn-outline-primary">検索</button>
        </form>
        <a href="./manual-form.html" target="_blank" rel="noopener noreferrer"
          class="btn btn-primary create-button">新規作成</a>
      </div>
    </header>

    <div class="alert mock-alert index-alert mb-0" role="alert">
      マニュアルを更新しました。
    </div>

    <div class="row g-4 align-items-start">
      <aside class="col-lg-2 col-md-3 sidebar">
        <div class="card">
          <div class="card-body">
            <div>
              <h2 class="h5">クイックビュー</h2>
            </div>
            <div>
              <ul class="list-group list-group-flush">
                <li class="list-group-item active d-flex justify-content-between align-items-center">
                  <span>自分の作成分</span>
                  <span class="sidebar-count" th:text="${listDto.summaryDto.countUserCreatedManual}">
                    8</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span>申請中</span>
                  <span class="sidebar-count" th:text="${listDto.summaryDto.countCreatedPendingManual}">
                    3</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span>最近更新</span>
                  <span class="sidebar-count" th:text="${listDto.summaryDto.countRecentWeeklyManual}">5</span>
                </li>
              </ul>
            </div>
            <div class="sidebar-section">
              <h2 class="h5">カテゴリ</h2>
              <div>
                <ul class="list-group list-group-flush" th:each="activeCategories:${listDto.activeCategories}">
                  <li class="list-group-item" th:text="${activeCategories.categoryName}">カテゴリ名</li>
                </ul>
              </div>
            </div>
            <div class="stopedCategory">
              <button class="stopped-toggle" type="button" data-bs-toggle="collapse"
                data-bs-target="#stoppedCategoryList" aria-expanded="false" aria-controls="stoppedCategoryList">
                <span>使用停止中</span>
                <span class="stopped-toggle-icon">＋</span>
              </button>
              <div class="collapse" id="stoppedCategoryList">
                <ul class="list-group list-group-flush" th:each="inactiveCategories:${listDto.inactiveCategories}">
                  <li class="list-group-item" th:text="${inactiveCategories.categoryName}">カテゴリ名</li>
                </ul>
              </div>
            </div>
            <div class="sidebar-home">
              <a th:href="@{/my-page}" class="sidebar-home-link" aria-label="マイページ">
                <span class="sidebar-home-icon-wrap">
                  <i class="bi bi-house-fill sidebar-home-icon" aria-hidden="true"></i>
                  <span class="sidebar-home-badge sidebar-home-badge-rollback">2</span>
                  <span class="sidebar-home-badge sidebar-home-badge-pending">4</span>
                </span>
                <span class="sidebar-home-user">
                  <span class="sidebar-home-user-label">ログイン中</span>
                  <span class="sidebar-home-user-name" th:text="${listDto.userDto.displayName}"></span>
                </span>
              </a>
            </div>
          </div>
        </div>
      </aside>

      <section class="col-lg-10 col-md-9">
        <div class="accordion w-100" id="accordionExample">
          <div class="accordion-item" th:each="manual,stat:${listDto.searchManuals}">
            <div class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                th:data-bs-target="|#collapse-${stat.index}|" th:attrappend="aria-controls=|collapse-${stat.index}|"
                aria-expanded="false">
                <div class="w-100">
                  <div class="d-flex justify-content-between align-items-center gap-2">
                    <strong class="fw-semibold" th:text="${manual.title}">マニュアルの作成手順</strong>
                    <span class="text-muted"><small class="pe-5"
                        th:text="|最終更新${#temporals.format(manual.updatedAt, 'yyyy-MM-dd HH:mm')} /作成者:${manual.createdUserDto.displayName}|">更新日
                        / 作成者: 山田 花子</small></span>
                  </div>
                  <div class="align-items-center gap-2">
                    <span class="text-muted"><small th:text="|マニュアルID:${manual.manualId}|">マニュアルID: 1001</small></span>
                    <span class="category" th:text="${manual.categoryDto.categoryName}">カテゴリ</span>
                    <span class="badge bg-primary" th:text="${manual.statusLabel}">申請待ち</span>
                  </div>
                </div>
              </button>
            </div>
            <div class="accordion-collapse collapse" th:id="|collapse-${stat.index}|"
              data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <p th:text="${manual.content}">見積作成から承認依頼までの業務手順をまとめたマニュアルです。</p>
                <div class="d-flex flex-wrap gap-2 mb-3">
                  <a href="./manual-detail.html" target="_blank" rel="noopener noreferrer"
                    class="btn btn-outline-primary btn-sm">詳細を見る</a>
                  <a href="./manual-form.html" target="_blank" rel="noopener noreferrer"
                    class="btn btn-outline-secondary btn-sm">編集</a>
                  <a href="./manual-form.html" target="_blank" rel="noopener noreferrer"
                    class="btn btn-outline-secondary btn-sm">複製</a>
                </div>
                <h2 class="history-title mb-2">更新履歴</h2>
                <ul class="history-list mb-0">
                  <li>2026-04-05: 本文の修正</li>
                  <li>2026-04-04: 新規作成</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <nav class="mt-4" aria-label="ページネーション">
          <ul class="pagination justify-content-center mb-0">
            <li class="page-item disabled"><span class="page-link">前へ</span></li>
            <li class="page-item active"><span class="page-link">1</span></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">次へ</a></li>
          </ul>
        </nav>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
