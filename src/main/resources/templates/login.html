<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="login-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="text-center mb-4">
          <h1 class="h4 mb-2">業務マニュアル管理システム</h1>
          <p class="text-muted mb-0">Manual Management System</p>
        </div>

        <div class="alert login-alert" role="alert" id="flashMessage" th:if="${message != null}" th:classappend="${
       messageType == 'success' ? ' alert-success' :
       messageType == 'error'   ? ' alert-danger'  :
       messageType == 'warning' ? ' alert-warning' : ' alert-info'
     }" th:text="${message != null and !#strings.isEmpty(message) ? message : ''}">
          ユーザーIDまたはパスワードが正しくありません。
        </div>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">ログイン</h2>
            <form action="/login" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

              <div class="mb-3">
                <label for="userId" class="form-label">userId</label>
                <input id="userId" name="username" type="text" class="form-control" th:errors="*{loginId}">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">password</label>
                <input id="password" name="password" type="password" class="form-control" th:errors="*{password}">
              </div>

              <button type="submit" class="btn btn-primary w-100">ログイン</button>
              <p></p>
            </form>
            <form id="guestLoginForm" th:action="@{/login/guest}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="inline-action-chip">
                ゲストユーザーでログインする。</button>
              <p></p>
              <small>ゲストユーザーでログインすると画面閲覧ができます。</small>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertEl = document.getElementById("flashMessage");
      if (!alertEl) return;
      setTimeout(() => {
        alertEl.style.transition = "opacity .4s";
        alertEl.style.opacity = "0";
        setTimeout(() => alertEl.remove(), 400);
      }, 3000);
    });
  </script>
</body>

</html>
