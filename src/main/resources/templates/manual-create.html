<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル新規作成</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>
  <main class="container mock-page">
    <div class="page-title-bar tight-gap">
      <div>
        <h1 class="h4 mb-1 d-flex">マニュアル新規作成</h1>
        <p class="text-muted mb-0 d-flex">必要な項目だけ入力して、新しいマニュアルを作成します。下書きは一時保存、公開は申請に進みます。</p>
      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary close-btn">閉じる</button>
    </div>

    <div class="alert manual-create-alert mt-0 mb-2" id="flashMessage" role="alert" th:if="${message != null}"
      th:classappend="${
       messageType == 'success' ? ' alert-success' :
       messageType == 'error'   ? ' alert-danger'  :
       messageType == 'warning' ? ' alert-warning' : ' alert-info'
     }" th:text="${message != null and !#strings.isEmpty(message) ? message : ''}">
      新規マニュアルの作成内容を入力してください。
    </div>

    <form class="card" th:object="${formDto}" th:action="@{/manuals/create/draft}" method="post">
      <div class="card-body">
        <div class="mb-3">
          <label for="title" class="form-label">タイトル</label>
          <input id="title" type="text" class="form-control" th:field="*{title}" placeholder="タイトルを入力してください"
            maxlength="100">
          <div class="text-count" data-for="title" data-max="100">0 / 100</div>
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">本文</label>
          <textarea id="content" class="form-control" th:field="*{content}" rows="8" maxlength="10000"
            placeholder="本文を入力してください"></textarea>
          <div class="text-count" data-for="content" data-max="10000">0 / 10000</div>
        </div>
        <div class="mb-3">
          <label for="category" class="form-label">カテゴリ</label>
          <select id="category" class="form-select" th:field="*{categoryId}"
            th:classappend="${#fields.hasErrors('categoryId')} ? ' is-invalid'">
            <option value="">選択してください</option>
            <option th:each="activeCategory:${categoryDto}" th:text="${activeCategory.categoryName}"
              th:value="${activeCategory.id}">営業部
            </option>
          </select>
          <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">
          </div>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      </div>
      <div class="card-footer d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary" th:disabled="${formDto.guest}">下書きに保存</button>
        <button type="submit" th:formaction="@{/manuals/create/pending}" formmethod="post"
          class="btn btn-outline-primary" th:disabled="${formDto.guest}">マニュアル公開</button>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:if="${manualListNeedsRefresh}">
    localStorage.setItem("manualListNeedsRefresh", Date.now());
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertEl = document.getElementById("flashMessage");
      if (!alertEl) return;
      setTimeout(() => {
        alertEl.style.transition = "opacity .4s";
        alertEl.style.opacity = "0";
        setTimeout(() => alertEl.remove(), 400);
      }, 3000);
    });
    function updateTextCount(inputId, maxLength) {
      const input = document.getElementById(inputId);
      const counter = document.querySelector(`.text-count[data-for="${inputId}"]`);

      if (!input || !counter) {
        return;
      }

      const currentLength = input.value.length;
      counter.textContent = `${currentLength} / ${maxLength}`;
      counter.classList.remove("is-near-limit", "is-over-limit");

      if (currentLength >= maxLength) {
        counter.classList.add("is-over-limit");
        return;
      }

      if (currentLength >= Math.floor(maxLength * 0.8)) {
        counter.classList.add("is-near-limit");
      }
    }

    ["title", "content"].forEach((inputId) => {
      const input = document.getElementById(inputId);
      const counter = document.querySelector(`.text-count[data-for="${inputId}"]`);

      if (!input || !counter) {
        return;
      }

      const maxLength = Number(counter.dataset.max);
      updateTextCount(inputId, maxLength);
      input.addEventListener("input", () => updateTextCount(inputId, maxLength));
    });
  </script>
  <script th:if="${myPageNeedsRefresh}">
    localStorage.setItem("myPageNeedsRefresh", Date.now());
  </script>
</body>

</html>
