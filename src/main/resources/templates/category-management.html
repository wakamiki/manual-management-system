<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カテゴリー管理画面</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
  <main class="container admin-page">
    <header class="page-title-bar admin-title-bar">
      <div>
        <h1 class="h4 mb-1 d-flex">カテゴリ管理</h1>
        <p class="mb-0 text-muted d-flex">カテゴリ名変更時は業務内容が変わらない時のみ使用してください。</p>
      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary admin-close-btn">閉じる</button>
    </header>

    <div class="alert category-management-alert mb-4" id="flashMessage" role="alert" th:if="${message != null}"
      th:classappend="${
       messageType == 'success' ? ' alert-success' :
       messageType == 'error'   ? ' alert-danger'  :
       messageType == 'warning' ? ' alert-warning' : ' alert-info'
     }" th:text="${message != null and !#strings.isEmpty(message) ? message : ''}">
      カテゴリを更新しました。
    </div>

    <section class="admin-layout">
      <div class="card admin-form-card">
        <div class="admin-mode-title d-flex justify-content-center" th:if="${'CREATE'.equals(viewDto.mode.name())}">
          カテゴリー新規作成モード</div>
        <div class="admin-mode-title d-flex justify-content-center" th:if="${'EDIT'.equals(viewDto.mode.name())}">
          カテゴリー変更モード</div>

        <div class="form-mode-info d-flex justify-content-end"
          th:if="${viewDto.mode != null and 'EDIT'.equals(viewDto.mode.name())}">
          <span class="admin-mode-select" th:text="|編集中:${formDto.categoryName}|">
            編集中:
          </span>
          <a class="admin-mode-select" th:href="@{/categories}">
            ×選択解除
          </a>
        </div>

        <div class="card-body">
          <form th:object="${formDto}" th:action="@{/categories/create}" method="post"
            th:onsubmit="${duplicate} ? 'return confirm(&quot;同名のカテゴリがあります。このまま更新しますか？&quot;);' : 'return true;'">

            <div class="mb-2" th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name())}">
              <label for="categoryId" class="form-label">categoryId</label>
              <input id="categoryId" type="text" class="form-control"
                th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name())}" th:field="*{id}" th:value="*{id}"
                readonly>
            </div>
            <div class="mb-3">
              <label for="categoryName" class="form-label">categoryName</label>
              <input id="categoryName" type="text" class="form-control" th:field="*{categoryName}"
                th:classappend="${#fields.hasErrors('categoryName')} ? ' is-invalid'">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryName')}" th:errors="*{categoryName}">
              </div>
            </div>
            <div class="mb-4">
              <label for="displayOrder" class="form-label">displayOrder</label>
              <input id="displayOrder" type="number" class="form-control" th:field="*{displayOrder}" min="1"
                placeholder="指定の番号に割り込み" th:classappend="${#fields.hasErrors('displayOrder')} ? ' is-invalid'">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}">
              </div>
            </div>
            <div class="admin-form-actions">
              <button type="submit" class="btn btn-primary admin-button-primry"
                th:if="${formDto != null and 'CREATE'.equals(viewDto.mode.name())}"
                th:formaction="@{/categories/create}" th:disabled="${viewDto.canGuest}">新規登録</button>
              <button type="submit" class="btn btn-outline-primary"
                th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name())}"
                th:formaction="@{/categories/{categoryId}/update(categoryId=*{id})}"
                th:disabled="${viewDto.canGuest}">変更</button>
              <button type="submit" class="btn btn-outline-danger" th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name()) and
              formDto.isActive==true}" th:formaction="@{/categories/{categoryId}/deactivate(categoryId=*{id})}"
                th:disabled="${viewDto.canGuest}">使用停止</button>
              <button type="submit" class="btn btn-outline-secondary" th:if="${formDto != null and 'EDIT'.equals(viewDto.mode.name()) and
              formDto.isActive==false}" th:formaction="@{/categories/{categoryId}/activate(categoryId=*{id})}"
                th:disabled="${viewDto.canGuest}">復帰</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card admin-table-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>カテゴリ一覧</span>
          <span class="admin-note">表示:ID順</span>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle user-table">
              <thead>
                <tr>
                  <th scope="col">categoryId</th>
                  <th scope="col">categoryName</th>
                  <th scope="col">displayOrder</th>
                  <th scope="col">status</th>
                  <th scope="col">操作</th>
                </tr>
              </thead>
              <tbody th:each="category:${viewDto.categoryListDto}">
                <tr>
                  <td th:text="${category.id}">01</td>
                  <td th:text="${category.categoryName}">営業部</td>
                  <td th:text="${category.displayOrder}">1</td>
                  <td><span class="admin-status is-active" th:text="${category.activeLabel}">使用中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <a class="btn btn-outline-primary btn-sm"
                        th:href="@{/categories/{categoryId}/action(categoryId=${category.id})}">変更</a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <nav class="admin-pagination" aria-label="カテゴリ一覧ページ切り替え" th:if="${viewDto.pagingDto.totalPages>0}">
            <ul class="pagination justify-content-center mb-0">
              <li class="page-item" th:classappend="${!viewDto.pagingDto.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/categories(page=${viewDto.pagingDto.currentPage-1},
                size=${viewDto.pagingDto.pageSize})}">前へ</a>
              </li>
              <li class="page-item" th:each="pageNum : ${#numbers.sequence(0,viewDto.pagingDto.totalPages - 1)}"
                th:classappend="${pageNum == viewDto.pagingDto.currentPage} ? 'active'">
                <a class="page-link" th:text="${pageNum+1}"
                  th:href="@{/categories(page=${pageNum},size=${viewDto.pagingDto.pageSize})}">1
                </a>
              </li>
              <li class="page-item" th:classappend="${!viewDto.pagingDto.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/categories(page=${viewDto.pagingDto.currentPage+1},
                size=${viewDto.pagingDto.pageSize})}">次へ</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertEl = document.getElementById("flashMessage");
      if (!alertEl) return;
      setTimeout(() => {
        alertEl.style.transition = "opacity .4s";
        alertEl.style.opacity = "0";
        setTimeout(() => alertEl.remove(), 400);
      }, 3000);
    });
  </script>
</body>

</html>
