<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www/thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>category-management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
  <main class="container admin-page">
    <header class="page-title-bar">
      <div>
        <h1 class="h4 mb-1">カテゴリ管理</h1>
        <p class="mb-0 text-muted">カテゴリ名変更時は業務内容が変わらない時のみ使用してください。</p>
      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary">閉じる</button>
    </header>

    <div class="alert admin-alert mb-4" role="alert">
     カテゴリを更新しました。
    </div>

    <section class="admin-layout">
      <div class="card admin-form-card">
        <div class="card-header">カテゴリ登録/更新</div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="categoryName" class="form-label">categoryName</label>
              <input id="categoryName" type="text" class="form-control" value="営業部">
            </div>
            <div class="mb-4">
              <label for="displayOrder" class="form-label">displayOrder</label>
              <input id="displayOrder" type="number" class="form-control" value="1" min="1" placeholder="指定の番号に割り込み">
            </div>
            <div class="admin-form-actions">
              <button type="button" class="btn btn-primary">新規登録</button>
              <button type="button" class="btn btn-outline-primary">更新</button>
              <button type="button" class="btn btn-outline-danger">使用停止</button>
              <button type="button" class="btn btn-outline-secondary">復帰</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card admin-table-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>カテゴリ一覧</span>
          <span class="admin-note">表示順で並び替え</span>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th scope="col">categoryId</th>
                  <th scope="col">categoryName</th>
                  <th scope="col">displayOrder</th>
                  <th scope="col">status</th>
                  <th scope="col">操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>01</td>
                  <td>営業部</td>
                  <td>1</td>
                  <td><span class="admin-status is-active">使用中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <button type="button" class="btn btn-outline-primary btn-sm">更新</button>
                      <button type="button" class="btn btn-outline-danger btn-sm">使用停止</button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>02</td>
                  <td>経理部</td>
                  <td>2</td>
                  <td><span class="admin-status is-active">使用中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <button type="button" class="btn btn-outline-primary btn-sm">更新</button>
                      <button type="button" class="btn btn-outline-danger btn-sm">使用停止</button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>03</td>
                  <td>経理部</td>
                  <td>3</td>
                  <td><span class="admin-status is-active">使用中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <button type="button" class="btn btn-outline-primary btn-sm">更新</button>
                      <button type="button" class="btn btn-outline-danger btn-sm">使用停止</button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>04</td>
                  <td>旧営業部</td>
                  <td>9</td>
                  <td><span class="admin-status is-inactive">停止中</span></td>
                  <td>
                    <div class="admin-inline-actions">
                      <button type="button" class="btn btn-outline-secondary btn-sm">復帰</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <nav class="admin-pagination" aria-label="カテゴリ一覧ページ切り替え">
            <ul class="pagination justify-content-center mb-0">
              <li class="page-item disabled"><span class="page-link">前へ</span></li>
              <li class="page-item active"><span class="page-link">1</span></li>
              <li class="page-item"><a class="page-link" href="#">2</a></li>
              <li class="page-item"><a class="page-link" href="#">3</a></li>
              <li class="page-item"><a class="page-link" href="#">次へ</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
