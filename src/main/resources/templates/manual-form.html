<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアルエディター</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>
  <main class="container mock-page">
    <div class="page-title-bar tight-gap">
      <div>
        <span class="badge mb-1 mode-badge" th:text="${formDto.modeLabel}">編集</span>
        <span class="text-muted mb-0" th:text="|${formDto.modeLabel}元マニュアルID: ${formDto.manualId}|">
          (複製元)(編集元)マニュアルID: 1001</span>
        <h1 class="h4 mb-1">マニュアルエディター</h1>

      </div>
      <button onclick="window.close()" class="btn btn-outline-secondary">閉じる</button>
    </div>

    <div class="alert manual-form-alert mt-0 mb-2" id="flashMessage" role="alert" th:if="${message != null}"
      th:classappend="${
       messageType == 'success' ? ' alert-success' :
       messageType == 'error'   ? ' alert-danger'  :
       messageType == 'warning' ? ' alert-warning' : ' alert-info'
     }" th:text="${message != null and !#strings.isEmpty(message) ? message : ''}">
      編集内容を更新できます。更新履歴は任意です。
    </div>

    <form class="card" method="post" th:object="${formDto}">
      <input type="hidden" name="mode" th:value="${formDto.mode}">
      <div class="card-body">
        <div class="mb-3">
          <label for="title" class="form-label">タイトル</label>
          <input id="title" type="text" class="form-control text-base" th:field="*{title}"
            th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'" maxlength="100">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
          </div>
          <div class="text-count" data-for="title" data-max="100">0 / 100</div>
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">本文</label>
          <textarea id="content" class="form-control text-base " th:field="*{content}"
            th:classappend="${#fields.hasErrors('content')} ? ' is-invalid'" rows="8" maxlength="10000"></textarea>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">
          </div>
          <div class="text-count" data-for="content" data-max="10000">0 / 10000</div>
        </div>
        <div class="mb-3">
          <label for="category" class="form-label">カテゴリ</label>
          <select id="category" class="form-select" th:field="*{categoryId}"
            th:classappend="${#fields.hasErrors('categoryId')} ? ' is-invalid'">
            <option value="">選択してください</option>
            <option class="text-base " th:each="category:${categoryDto}" th:value="${category.id}"
              th:text="${category.categoryName}">
              営業部
            </option>
          </select>
          <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">
          </div>
        </div>
        <div class="mb-3">
          <label for="changeNote" class="form-label">更新履歴</label>
          <input id="changeNote" type="text" th:field="*{changeNote}"
            th:classappend="${#fields.hasErrors('changeNote')} ? ' is-invalid'" class="form-control text-base"
            maxlength="100">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('changeNote')}" th:errors="*{changeNote}">
          </div>
          <div class="text-count" data-for="changeNote" data-max="100">0 / 100</div>
        </div>
      </div>
      <div class="card-footer d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-outline-primary" th:formaction="${formDto.mode == 'edit'}
  ? @{/manuals/{manualId}/actions/save-draft(manualId=${formDto.manualId})}
  : @{/manuals/{manualId}/actions/save-draft-copy(manualId=${formDto.manualId})}"
          th:disabled="${formDto.guest}">
          下書きに保存</button>
        <button type="submit" class="btn btn-outline-primary" th:formaction="${formDto.mode == 'edit'}
  ? @{/manuals/{manualId}/actions/save-pending(manualId=${formDto.manualId})}
  : @{/manuals/{manualId}/actions/save-pending-copy(manualId=${formDto.manualId})}" th:disabled="${formDto.guest}">
          マニュアル公開</button>

      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertEl = document.getElementById("flashMessage");
      if (!alertEl) return;
      setTimeout(() => {
        alertEl.style.transition = "opacity .4s";
        alertEl.style.opacity = "0";
        setTimeout(() => alertEl.remove(), 400);
      }, 3000);
    });

    function updateTextCount(inputId, maxLength) {
      const input = document.getElementById(inputId);
      const counter = document.querySelector(`.text-count[data-for="${inputId}"]`);

      if (!input || !counter) {
        return;
      }

      const currentLength = input.value.length;
      counter.textContent = `${currentLength} / ${maxLength}`;
      counter.classList.remove("is-near-limit", "is-over-limit");

      if (currentLength >= maxLength) {
        counter.classList.add("is-over-limit");
        return;
      }

      if (currentLength >= Math.floor(maxLength * 0.8)) {
        counter.classList.add("is-near-limit");
      }
    }

    ["title", "content", "changeNote"].forEach((inputId) => {
      const input = document.getElementById(inputId);
      const counter = document.querySelector(`.text-count[data-for="${inputId}"]`);

      if (!input || !counter) {
        return;
      }

      const maxLength = Number(counter.dataset.max);
      updateTextCount(inputId, maxLength);
      input.addEventListener("input", () => updateTextCount(inputId, maxLength));
    });
  </script>
</body>

</html>
